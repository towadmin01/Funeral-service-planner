  h+='<h4><b>E</b>Declaration</h4><div style="font-size:10.5pt">'+DECLARATION+'</div><div class="pz-sign"><div>Name: '+(c?esc(c.ack.name):'')+'</div><div>Signature: '+(c&&c.ack.sig?'<img src="'+c.ack.sig+'" style="height:46px">':'')+'</div><div style="flex:.6">Date: '+(c&&c.ack.date?fmtDate(c.ack.date,false):'')+'</div></div></div>';
  // Section F
  const segRows=(type,d)=>{ const rows=d?progRows(c,d).filter(x=>!x.s.skip):(type==='funeral'?SEG_FUNERAL:SEG_WAKE).map(s=>({s,time:''})); return rows.map(x=>'<tr><td style="width:70px">'+(x.time?fmtTime(x.time):'')+'</td><td style="font-weight:600">'+esc(x.s.seg)+'</td><td>'+esc(x.s.desc||'')+'</td><td>'+(d?esc(picFor(d,x.s)):(x.s.role==='eulogy'?'Name: ____________<br>Name: ____________':({minister:'Pastor',wl:'Worship Team',reader:'Family / Pastor'}[x.s.role]||'')))+'</td></tr>').join(''); };
  const fTbl=(label,type,d)=>'<div class="pz-day"><div class="dh">'+label+'</div><table class="pz-f"><tr><td class="l" style="width:70px">TIME</td><td class="l">SEGMENT</td><td class="l">DESCRIPTION</td><td class="l">PERSON IN CHARGE</td></tr>'+segRows(type,d)+'</table></div>';
  h+='<div class="pz-page">'+pzHead('Section F · Programme flow','');
  if(c){ wakes(c).forEach((d,i)=>h+=fTbl('Day '+(i+1)+': Wake Service','wake',d)); h+=fTbl('Funeral Service','funeral',fun(c)); }
  else h+=fTbl('Day 1: Wake Service','wake')+fTbl('Day 2: Wake Service','wake')+fTbl('Day 3: Wake Service','wake')+fTbl('Funeral Service','funeral');
  return h+'</div>';
}
function isDoneKey(c,k){ for(const st of STAGES){ const it=st.items.find(i=>i.k===k); if(it) return isDone(c,it); } return !!(c.checks[k]&&c.checks[k].done); }
function guideHTML(c){ return '<div class="pz-page pz-guide">'+pzHead('A gentle guide for the days ahead', c?'For the family of<br><b>'+esc(c.deceased.name||'')+'</b>':'')+'<p>We are so sorry for your loss. Here is a simple list to help — take it one step at a time, and call us whenever you need help.</p>'+GUIDE.map(g=>'<h4>'+g.h+'</h4><ul>'+g.p.map(p=>'<li>☐ '+esc(p)+'</li>').join('')+'</ul>').join('')+'<p class="pz-small">Your contact at church: <b>'+esc(c?(c.call.coordinator||c.call.receivedBy):'')+'</b><br><i>This is general guidance; your undertaker will advise on the exact steps.</i></p></div>'; }

/* ---------------- Files (uploaded obituary, programme, photos) ---------------- */
const FILE_KINDS=[['obituary','Obituary'],['programme','Programme flow'],['form','Signed form'],['photo','Photos'],['other','Other']];
const kindName = k => (FILE_KINDS.find(x=>x[0]===k)||['','Other'])[1];
const fsize = n => n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function filesBox(c, kind, open){
  const list=c.files.filter(f=>!kind||f.kind===kind);
  let b=list.length?list.map(f=>'<div class="frow"><span class="ficon">'+(/pdf/.test(f.mime)?'PDF':'IMG')+'</span><div class="grow" style="min-width:0"><div class="fname">'+esc(f.name)+'</div><div class="small muted">'+(kind?'':kindName(f.kind)+' · ')+fsize(f.size||0)+(f.by?' · '+esc(f.by):'')+'</div></div><button class="btn sm" data-fview="'+f.id+'">View</button><button class="btn sm danger" data-fdel="'+f.id+'" title="Remove">✕</button></div>').join(''):'<div class="small muted" style="padding:4px 0 8px">No files uploaded yet.</div>';
  const tk = kind ? [kind] : ['obituary','programme'];
  b+=tk.map(k=>'<div style="margin-top:12px"><label class="f">'+kindName(k)+' text <small>(paste from WhatsApp or type — optional)</small></label><textarea data-b="texts.'+k+'" style="min-height:'+(c.texts[k]?150:70)+'px" placeholder="Paste the '+kindName(k).toLowerCase()+' here…">'+esc(c.texts[k])+'</textarea>'+(c.texts[k]?'<div class="btnrow" style="margin-top:6px"><button class="btn sm" data-copytext="'+k+'">Copy</button></div>':'')+'</div>').join('');
  const iid='up-'+(kind||'all');
  b+='<div class="uprow">'+(kind?'':'<select id="upKind" style="width:auto;min-height:38px">'+FILE_KINDS.map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('')+'</select>')+
    '<label class="btn primary sm" for="'+iid+'" style="cursor:pointer">⤒ Upload '+(kind?kindName(kind).toLowerCase():'file')+'</label><input type="file" id="'+iid+'" data-upload="'+(kind||'')+'" accept="image/*,application/pdf" multiple style="display:none"><span class="small muted">PDF or photo · up to 15 MB</span></div>';
  const title=kind?(kind==='obituary'?'Uploaded obituary':'Uploaded programme flow'):'Files, text & attachments';
  const n=list.length+tk.filter(k=>c.texts[k]&&c.texts[k].trim()).length;
  return box('files-'+(kind||'all'), sec('',title, kind?'':'obituary, programme, photos, text'), b, {open:open||n>0, right:n?'<span class="chip navy">'+n+'</span>':''});
}
function readAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function shrinkImage(dataUrl,max){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); if(k===1&&dataUrl.length<2.5e6) return res(dataUrl); const cv=document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k); const x=cv.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,cv.width,cv.height); x.drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL('image/jpeg',.86)); }; img.onerror=()=>res(dataUrl); img.src=dataUrl; }); }
async function uploadFiles(c, files, kind){
  for(const file of files){
    if(file.size>15*1048576){ toast(file.name+' is over 15 MB'); continue; }
    const isImg=/^image\//.test(file.type), isPdf=file.type==='application/pdf';
    if(!isImg&&!isPdf){ toast('Please upload a PDF or photo'); continue; }
    setSync('saving','Uploading '+file.name+'…');
    try{
      let url=await readAsDataURL(file); let mime=file.type, name=file.name;
      if(isImg){ url=await shrinkImage(url,2000); if(url.startsWith('data:image/jpeg')&&!/\.jpe?g$/i.test(name)) { mime='image/jpeg'; name=name.replace(/\.\w+$/,'')+'.jpg'; } }
      const data=url.split(',')[1], size=Math.round(data.length*0.75);
      const entry={kind, name, mime, size, by:ls('tow_fn_me')||'', at:new Date().toISOString()};
      if(LOCAL){ entry.id=uid(); entry.data=url; }
      else { const j=await api({action:'upload', caseId:c.id, name, mime, data}); if(!j.ok) throw new Error(j.error||'Upload failed'); entry.id=j.fileId; }
      c.files.push(entry); touch(c);
    }catch(e){ if(e.message!=='PIN') toast('Could not upload '+file.name+(e.message?' — '+e.message:'')); }
  }
  await flush(); keep(renderCase); toast('Uploaded');
}
async function viewFile(c,id){
  const f=c.files.find(x=>x.id===id); if(!f) return;
  const isPdf=/pdf/.test(f.mime);
  let dataUrl=f.data;
  if(!dataUrl){ setSync('saving','Opening file…'); try{ const j=await api({action:'file',fileId:id}); if(!j.ok) throw new Error(j.error||'Not found'); dataUrl='data:'+j.mime+';base64,'+j.data; setSync('','Synced'); }catch(e){ toast('Could not open file'); setSync('err','Error'); return; } }
  const bin=atob(dataUrl.split(',')[1]); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([arr],{type:f.mime}));
  if(isPdf){ modal('<div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><span class="ficon">PDF</span><div style="min-width:0"><h3 style="font-size:20px;margin:0">'+esc(f.name)+'</h3><div class="small muted">'+kindName(f.kind)+' · '+fsize(f.size||0)+'</div></div></div><div class="btnrow" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Close</button><a class="btn" href="'+url+'" download="'+esc(f.name)+'">⤓ Download</a><a class="btn primary" href="'+url+'" target="_blank" rel="noopener">Open PDF</a></div>'); return; }
  modal('<h3 style="font-size:20px">'+esc(f.name)+'</h3><img src="'+url+'" style="width:100%;max-height:65vh;object-fit:contain;border-radius:8px;background:#f4f2ec;margin:6px 0 12px"><div class="btnrow" style="justify-content:flex-end"><a class="btn" href="'+url+'" download="'+esc(f.name)+'">⤓ Download</a><button class="btn primary" onclick="closeModal()">Close</button></div>');
}

/* ---------------- Binding ---------------- */
function keep(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
function bind(c){
  const app=$('#app');
  app.oninput=e=>{
    const el=e.target, path=el.dataset.b; if(!path||el.type==='file') return;
    let v=el.type==='checkbox'?el.checked:el.value; if(el.type==='number'&&v!=='') v=Number(v);
    setP(c,path,v);
    if(path==='deceased.dob'||path==='deceased.dop'){ const a=calcAge(c.deceased.dob,c.deceased.dop); if(a!==''){ c.deceased.age=a; const ae=app.querySelector('[data-b="deceased.age"]'); if(ae) ae.value=a; } }
    if(path==='days.0.date') syncDates(c);
    if(/^tasks\.\w+\.who$/.test(path) && !c.call.coordinator) {}
    touch(c); renderHead(c);
    if(S.tab==='obituary') renderObit(c);
    if(el.dataset.rr && (el.type==='radio'||el.type==='checkbox')) keep(renderCase);
  };
  app.onchange=e=>{
    const el=e.target;
    if(el.dataset.arr){ const arr=(getP(c,el.dataset.arr)||[]).slice(); const i=arr.indexOf(el.value); if(el.checked&&i<0) arr.push(el.value); if(!el.checked&&i>=0) arr.splice(i,1); setP(c,el.dataset.arr,arr); touch(c); return; }
    if(el.dataset.check){ const k=el.dataset.check, me=ls('tow_fn_me')||'', at=new Date().toISOString();
      if(el.dataset.task){ const T=c.tasks[el.dataset.task]; T.status=el.checked?'Done':'To do'; T.by=el.checked?me:''; T.at=el.checked?at:''; }
      else if(el.checked) c.checks[k]={done:true,by:me,at}; else c.checks[k]=el.dataset.auto?{done:false,off:true}:{done:false};
      touch(c); keep(renderCase); return; }
    if(el.dataset.skip){ const [i,j]=el.dataset.skip.split('.').map(Number); c.days[i].prog[j].skip=!el.checked; touch(c); keep(renderCase); return; }
    if(el.id==='photoIn'&&el.files[0]) return loadPhoto(el.files[0],c);
    if(el.dataset.upload!==undefined && el.files.length){ const kind=el.dataset.upload || ($('#upKind')||{}).value || 'other'; return uploadFiles(c,[...el.files],kind); }
    if(el.dataset.b && /^tasks\.\w+\.status$/.test(el.dataset.b)){ const T=getP(c,el.dataset.b.replace('.status','')); if(T.status==='Done'){ T.by=ls('tow_fn_me')||''; T.at=new Date().toISOString(); } touch(c); }
    if(el.dataset.b && el.dataset.rr && (el.tagName==='SELECT'||el.type==='date'||el.type==='number')) keep(renderCase);
  };
  app.onclick=e=>{
    const t=e.target.closest('[data-act],[data-addnote],[data-copytext],[data-fview],[data-fdel],[data-goshare],[data-copy],[data-tg],[data-copyroster],[data-resetprog],[data-tpl],[data-all],[data-toggle]'); if(!t) return;
    if(t.dataset.copytext){ copy(c.texts[t.dataset.copytext]||''); return; }
    if(t.dataset.fview){ viewFile(c,t.dataset.fview); return; }
    if(t.dataset.fdel){ const f=c.files.find(x=>x.id===t.dataset.fdel); confirmBox('Remove this file?','“'+(f?f.name:'')+'” will be removed from this record.','Remove',async()=>{ if(!LOCAL){ try{ await api({action:'deleteFile',fileId:f.id}); }catch(e){} } c.files=c.files.filter(x=>x!==f); touch(c); await flush(); keep(renderCase); toast('File removed'); }); return; }
    if(t.dataset.addnote){ const inp=t.nextElementSibling; inp.style.display=''; inp.focus(); t.remove(); return; }
    if(t.dataset.goshare){ e.preventDefault(); e.stopPropagation(); S.tab=['tasks','roster'].includes(t.dataset.goshare)?'team':'notices'; COL[S.cur+':msg-'+t.dataset.goshare]=true; renderCase(); const m=$('[data-box="msg-'+t.dataset.goshare+'"]'); if(m) setTimeout(()=>m.scrollIntoView({behavior:'smooth',block:'start'}),60); return; }
    if(t.dataset.copy){ copy(MSGS[t.dataset.copy].body(c)); return; }
    if(t.dataset.tg){ sendTG(MSGS[t.dataset.tg].body(c)); return; }
    if(t.dataset.copyroster){ const i=Number(t.dataset.copyroster); c.days[i].roster=Object.assign({},c.days[i-1].roster); touch(c); keep(renderCase); toast('Team copied'); return; }
    if(t.dataset.resetprog){ const i=Number(t.dataset.resetprog); c.days[i].prog=blankProg(c.days[i].type); touch(c); keep(renderCase); return; }
    if(t.dataset.tpl){ c.obit.tpl=t.dataset.tpl; touch(c); $$('.tpl').forEach(x=>x.classList.toggle('on',x===t)); renderObit(c); return; }
    if(t.dataset.all){ $$('.box').forEach(b=>toggleBox(b,t.dataset.all==='1')); return; }
    if(t.dataset.toggle){ if(e.target.closest('input,select,textarea,a,button:not(.chev)')) return; toggleBox(t.closest('.box')); return; }
    const a=t.dataset.act;
    if(a==='wakePlus'){ const w=wakes(c); const nd=newDay('wake',w[w.length-1]); c.days.splice(w.length,0,nd); const f=fun(c); if(f.date&&nd.date&&f.date<=nd.date) f.date=addDays(nd.date,1); touch(c); keep(renderCase); }
    if(a==='wakeMinus'){ const w=wakes(c); if(w.length<=1){ toast('At least one wake night'); return; } c.days.splice(w.length-1,1); touch(c); keep(renderCase); }
    if(a==='close'){ c.status='closed'; touch(c); renderCase(); toast('Case closed — kept in Past records'); }
    if(a==='reopen'){ c.status='active'; touch(c); renderCase(); }
    if(a==='delete') confirmBox('Delete this request?','This removes the record for '+(c.deceased.name||'this case')+' for everyone. To keep it in history, use “Mark case closed” instead.','Delete',async()=>{ delete S.full[c.id]; S.index=S.index.filter(x=>x.id!==c.id); S.dirty.delete(c.id); if(LOCAL) flush(); else { try{ await api({action:'delete',id:c.id}); }catch(e){} } S.view='home'; render(); toast('Deleted'); });
    if(a==='printProg') doPrint(printProgramme(c));
    if(a==='printForm') doPrint(formHTML(c));
    if(a==='printFam') doPrint('<div class="pz-page">'+pzHead('Funeral Service — Guidelines &amp; Declaration','For the family of<br><b>'+esc(c.deceased.name||'')+'</b>')+'<h4><b>C</b>Guidelines for the service</h4>'+declHTML(c)+'</div>');
    if(a==='printGuide') doPrint(guideHTML(c));
    if(a==='printObit'){ const D=obData(c); doPrint('<div class="pz-obit">'+(TPL[c.obit.tpl]||TPL.grace)(D)+'</div>'); }
    if(a==='copyObit') copy(obitText(c));
    if(a==='rmPhoto'){ c.obit.photo=''; c.obit.photoG=''; touch(c); renderCase(); }
    if(a==='obitImg') saveObitImage(c);
    if(a==='sigSave') saveSig(c);
    if(a==='sigReset'){ const cv=$('#sigPad'); cv.getContext('2d').clearRect(0,0,cv.width,cv.height); initSig(c); }
    if(a==='sigClear'){ c.ack.sig=''; touch(c); keep(renderCase); }
  };
}
function syncDates(c){ const w=wakes(c); for(let i=1;i<w.length;i++) if(w[i].same) w[i].date=addDays(w[0].date,i); const f=fun(c); if(w.length&&w[0].date&&!(f.date&&f.date>w[w.length-1].date)) f.date=addDays(w[w.length-1].date,1); }
async function copy(txt){ try{ await navigator.clipboard.writeText(txt); toast('Copied — paste into WhatsApp'); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied'); }catch(_){ toast('Could not copy'); } ta.remove(); } }
async function sendTG(text){ try{ const j=await api({action:'notify',text:text.replace(/\*/g,'').replace(/(^|\s)_([^_]+)_/g,'$1$2')}); toast(j.ok?'Sent to Telegram':'Telegram: '+(j.error||'failed')); }catch(e){} }
function loadPhoto(file,c){ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const W=420,H=500,cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d'); const s=Math.max(W/img.width,H/img.height), w=img.width*s, h=img.height*s; x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.drawImage(img,(W-w)/2,(H-h)/2,w,h); c.obit.photo=cv.toDataURL('image/jpeg',.82); c.obit.photoG=''; touch(c); renderCase(); }; img.src=r.result; }; r.readAsDataURL(file); }
async function saveObitImage(c){
  if(!window.html2canvas){ toast('Image tool not loaded — use Print instead'); return; }
  toast('Preparing image…');
  const holder=document.createElement('div'); holder.style.cssText='position:fixed;left:-10000px;top:0;'; holder.innerHTML=(TPL[c.obit.tpl]||TPL.grace)(obData(c)); document.body.appendChild(holder);
  try{ if(document.fonts) await document.fonts.ready; const cv=await html2canvas(holder.firstChild,{scale:3,useCORS:true,backgroundColor:null}); const a=document.createElement('a'); a.href=cv.toDataURL('image/png'); a.download='Obituary - '+(c.deceased.name||'TOW')+'.png'; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ toast('Could not create image — use Print instead'); }
  holder.remove();
}

/* ---------------- Start ---------------- */
(async function init(){
  updateMe();
  prepOrnaments().then(()=>{ if(S.view==='case'&&S.tab==='obituary'&&cur()) renderObit(cur()); });
  if(!LOCAL && !S.pin){ showLock(); return; }
  try{ await loadIndex(); }catch(e){ if(e.message==='PIN') return; }
  render();
  if(!ls('tow_fn_me')) pickMe(true);
  setInterval(async()=>{ if(!LOCAL && S.view==='home' && !S.dirty.size && document.visibilityState==='visible'){ try{ await loadIndex(); renderHome(); }catch(e){} } },60000);
})();
</script>
