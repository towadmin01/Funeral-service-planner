<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<title>TOW Funeral Service Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500;600&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --navy:#1F3864; --navy-dark:#152647; --cream:#FAF8F3; --gold:#C9A227;
    --green:#1E7A46; --green-bg:#DFF3E7; --amber:#9C6500; --amber-bg:#FFF2CC; --red:#9C0006; --red-bg:#FCE0E0;
    --ink:#20241F; --muted:#847e6a; --line:#E4DFD3; --soft:#F1ECDF;
    --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  header{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 12px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  .brandrow{display:flex;align-items:center;gap:10px;max-width:780px;margin:0 auto;}
  .header-logo{height:34px;width:auto;flex-shrink:0;}
  .header-titles{flex:1;min-width:0;}
  header .brand{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;}
  header h1{margin:2px 0 0;font-size:19px;font-weight:700;letter-spacing:-.01em;}
  .hbtn{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis;}
  .hbtn.icon{display:inline-flex;align-items:center;justify-content:center;padding:7px 9px;text-decoration:none;}
  .tabs{display:flex;gap:6px;margin:12px auto 0;max-width:780px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:1 0 auto;min-width:84px;text-align:center;padding:9px 8px;border-radius:8px;font-size:12px;font-weight:600;color:rgba(255,255,255,.65);background:rgba(255,255,255,.06);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--gold);color:var(--navy-dark);}
  .meta{padding:9px 16px;font-size:12.5px;color:#5b5748;background:var(--cream);border-bottom:1px solid var(--line);}
  .meta-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;justify-content:space-between;}
  #crumb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  main{padding:12px;max-width:780px;margin:0 auto;padding-bottom:110px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;}
  /* collapsible boxes */
  .box{padding:0;overflow:hidden;}
  .box-h{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
  .box-h:hover{background:#FDFCF8;}
  .box-h .grow{flex:1;min-width:0;}
  .chev{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .2s;background:#fff;}
  .chev:after{content:"";width:7px;height:7px;border:solid var(--navy);border-width:0 1.8px 1.8px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .box.shut .chev{transform:rotate(-90deg);}
  .box-b{padding:0 16px 16px;}
  .box.shut .box-b{display:none;}
  .box .box{border-radius:10px;margin:12px 0 0;background:#FDFCF9;}
  .tools{display:flex;justify-content:flex-end;gap:12px;margin:-2px 2px 8px;}
  .tools button{background:none;border:none;color:var(--navy);font-size:12px;font-weight:600;cursor:pointer;padding:4px 0;}
  .sec-title{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .sec-title .letter{font-family:var(--serif);font-size:22px;color:var(--gold);font-weight:700;line-height:1;}
  .sec-title h2{margin:0;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);font-weight:700;}
  .sec-title .hint{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;}
  .h3{margin:0;font-family:var(--serif);font-size:20px;color:var(--navy-dark);font-weight:600;line-height:1.15;}
  .h3 small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;}
  .full{grid-column:1/-1;}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}
  label.f{display:block;font-size:11.5px;font-weight:600;color:#5b5748;margin-bottom:4px;}
  label.f small{font-weight:500;color:var(--muted);}
  input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],input[type=password],select,textarea{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);font-size:16px;font-family:inherit;background:#fff;color:var(--ink);min-height:42px;}
  @media(min-width:700px){input[type=text],input[type=tel],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{font-size:14px;}}
  textarea{min-height:70px;resize:vertical;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.15);}
  .pills{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{position:relative;}
  .pill input{position:absolute;opacity:0;pointer-events:none;}
  .pill span{display:inline-block;padding:8px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;cursor:pointer;background:#fff;color:#5b5748;}
  .pill input:checked + span{background:var(--navy);border-color:var(--navy);color:#fff;}
  .pill.multi input:checked + span:before{content:"✓ ";}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 13px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;min-height:38px;}
  .btn:hover{border-color:var(--gold);}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.gold{background:var(--gold);color:var(--navy-dark);border-color:var(--gold);}
  .btn.wa{background:#1F8F55;color:#fff;border-color:#1F8F55;}
  .btn.tg{background:#2A8BC8;color:#fff;border-color:#2A8BC8;}
  .btn.danger{color:var(--red);}
  .btn.sm{padding:6px 10px;font-size:12px;min-height:32px;}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .muted{color:var(--muted);} .small{font-size:12px;}
  .chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;display:inline-block;}
  .chip.gold{background:#F6EED3;color:#7a5f0b;} .chip.green{background:var(--green-bg);color:var(--green);}
  .chip.amber{background:var(--amber-bg);color:var(--amber);} .chip.grey{background:var(--soft);color:#5b5748;} .chip.navy{background:#E3E8F3;color:var(--navy);}
  .bar{height:5px;background:var(--soft);border-radius:4px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ddb94a);border-radius:4px;}
  .note{font-size:12px;background:var(--soft);border-radius:8px;padding:9px 11px;color:#5b5748;line-height:1.5;margin-top:10px;}
  /* home */
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .toolbar input[type=search]{flex:1;min-width:170px;}
  .case-card{cursor:pointer;}
  .case-card:hover{border-color:var(--gold);box-shadow:0 3px 14px rgba(31,56,100,.07);}
  .cname{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--navy-dark);line-height:1.15;}
  .cname .zh{font-family:"Noto Serif SC",serif;font-size:16px;color:var(--muted);margin-left:6px;font-weight:400;}
  .crow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .cmeta{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .yearhd{font-family:var(--serif);font-size:18px;color:var(--gold);font-weight:700;margin:16px 4px 8px;letter-spacing:.04em;}
  .empty{text-align:center;padding:46px 20px;color:var(--muted);}
  .case-head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;position:relative;overflow:hidden;}
  .case-head:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);}
  .back{background:none;border:none;color:var(--navy);font-size:12.5px;font-weight:600;cursor:pointer;padding:0;margin-bottom:6px;}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
  .stepper button{border:none;background:#fff;width:38px;height:38px;font-size:18px;color:var(--navy);cursor:pointer;font-weight:700;}
  .stepper b{min-width:30px;text-align:center;font-size:15px;}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#5b5748;cursor:pointer;user-select:none;}
  .switch input{display:none;}
  .switch i{width:36px;height:21px;border-radius:20px;background:#d9d3c3;position:relative;flex-shrink:0;transition:background .15s;}
  .switch i:after{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2);}
  .switch input:checked + i{background:var(--navy);} .switch input:checked + i:after{left:17px;}
  /* workflow */
  .stage{position:relative;padding-left:42px;}
  .stage:before{content:"";position:absolute;left:15px;top:30px;bottom:-12px;width:2px;background:var(--line);}
  .stage:last-child:before{display:none;}
  .stage .num{position:absolute;left:0;top:12px;width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:17px;color:var(--muted);z-index:1;}
  .stage.done .num{background:var(--green);border-color:var(--green);color:#fff;}
  .stage.current .num{background:var(--gold);border-color:var(--gold);color:var(--navy-dark);}
  .owner{font-size:11.5px;color:var(--muted);margin-top:2px;} .owner b{color:#5b5748;}
  .item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #F3EFE6;cursor:pointer;}
  .item:first-child{border-top:none;}
  .item > input{display:none;}
  .box-ck{width:22px;height:22px;border-radius:6px;border:1.5px solid #cfc7b2;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#fff;}
  .item > input:checked + .box-ck{background:var(--green);border-color:var(--green);}
  .item > input:checked + .box-ck:after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px);}
  .item .txt{flex:1;font-size:13.5px;line-height:1.4;}
  .item > input:checked ~ .txt .t{color:var(--muted);text-decoration:line-through;text-decoration-color:#cfc7b2;}
  .item .sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .item .sub .warn{color:var(--amber);font-weight:600;}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;background:var(--soft);color:#7a735e;margin-left:6px;vertical-align:1px;}
  .tag.auto{background:#E3E8F3;color:var(--navy);}
  .grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:12px 0 4px;}
  .ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
  @media(max-width:560px){.ckgrid{grid-template-columns:1fr;}}
  .ckgrid .item{border-top:1px solid #F3EFE6;}
  /* assignments */
  .asg{display:grid;grid-template-columns:1.4fr 1.2fr 110px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #F3EFE6;}
  .asg:first-child{border-top:none;}
  .asg .tn{font-size:13.5px;font-weight:600;color:var(--ink);}
  .asg select,.asg input{min-height:38px;padding:7px 9px;}
  .asg .notes{grid-column:1/-1;}
  @media(max-width:560px){.asg{grid-template-columns:1fr 104px;}.asg .tn{grid-column:1/-1;}}
  /* programme */
  .tblwrap{overflow-x:auto;margin:0 -4px;}
  table.prog{width:100%;border-collapse:collapse;font-size:13px;}
  table.prog th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px;border-bottom:1px solid var(--line);}
  table.prog td{padding:6px;border-bottom:1px solid #F3EFE6;vertical-align:middle;}
  table.prog td.tm{font-weight:700;color:var(--navy);white-space:nowrap;width:68px;}
  table.prog input{padding:6px 7px;font-size:13px;min-height:34px;}
  table.prog input.dur{width:58px;text-align:center;}
  .picin{min-width:120px;} .picin::placeholder{color:var(--navy);opacity:.85;}
  table.prog tr.skip td{opacity:.4;}
  @media(max-width:560px){table.prog .hide-m{display:none;}}
  /* share */
  .msg{white-space:pre-wrap;font-size:13px;line-height:1.55;background:#FDFCF9;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:280px;overflow:auto;margin:0 0 10px;color:#36342c;}
  .sig{border:1.5px dashed #cfc7b2;border-radius:10px;background:#fff;touch-action:none;width:100%;height:170px;display:block;cursor:crosshair;}
  .sigimg{max-width:280px;max-height:110px;display:block;border-bottom:1px solid #999;}
  /* obituary */
  .tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin;}
  .tpl{flex:0 0 auto;width:86px;cursor:pointer;text-align:center;font-size:11.5px;color:#5b5748;font-weight:600;}
  .tpl .sw{height:110px;border-radius:8px;border:2px solid var(--line);margin-bottom:5px;background-size:cover;background-position:center;position:relative;overflow:hidden;}
  .tpl.on .sw{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,39,.25);}
  .obwrap{position:relative;overflow:hidden;}
  .obscale{width:540px;transform-origin:top left;position:absolute;top:0;left:0;}
  .frow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F3EFE6;}
  .frow:first-child{border-top:none;}
  .ficon{width:38px;height:44px;border-radius:6px;background:#F3EFE4;color:var(--navy);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--line);}
  .fname{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .uprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  /* overlays */
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--navy-dark);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:100;pointer-events:none;max-width:90vw;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .modal-bg{position:fixed;inset:0;background:rgba(21,38,71,.45);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px;}
  .modal{background:#fff;border-radius:14px;padding:22px;max-width:390px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .modal h3{margin:0 0 6px;font-family:var(--serif);font-size:24px;color:var(--navy-dark);font-weight:600;}
  .modal p{font-size:13.5px;color:#5b5748;line-height:1.5;margin:0 0 14px;}
  .saved-ok{text-align:center;padding:26px 22px;}
  .saved-ok .tick{width:58px;height:58px;border-radius:50%;background:var(--green);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;animation:pop .35s ease;}
  .saved-ok .tick:after{content:"";width:13px;height:25px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-2px,-3px);}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  .savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(250,248,243,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
  .savebar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .savebar .btn{min-width:120px;justify-content:center;}
  .sync{font-size:11.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;}
  .sync:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green);}
  .sync.saving:before{background:var(--gold);} .sync.err:before{background:var(--red);} .sync.local:before{background:#aaa;}
  .lock{max-width:360px;margin:50px auto;text-align:center;}
  .menu{position:relative;}
  #printZone{display:none;}
  @media print{
    @page{size:A4;margin:12mm;}
    body.printing > *:not(#printZone){display:none !important;}
    body.printing #printZone{display:block;}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    body.printing{background:#fff;}
  }

  /* ============ PRINT LAYOUTS ============ */
  .pz{font-family:var(--sans);color:#222;font-size:11.5pt;}
  .pz-page{page-break-after:always;break-after:page;}
  .pz-page:last-child{page-break-after:auto;break-after:auto;}
  .pz-head{display:flex;align-items:center;gap:12px;border-bottom:2px solid #1F3864;padding-bottom:8px;margin-bottom:14px;}
  .pz-head img{height:40px;}
  .pz-head .t1{font-size:9pt;letter-spacing:.16em;text-transform:uppercase;color:#9a7b12;font-weight:700;}
  .pz-head .t2{font-family:var(--serif);font-size:20pt;font-weight:600;color:#152647;line-height:1.1;}
  .pz-head .rt{margin-left:auto;text-align:right;font-size:9pt;color:#555;}
  .pz h4{font-size:10pt;letter-spacing:.12em;text-transform:uppercase;color:#1F3864;margin:16px 0 6px;font-weight:700;}
  .pz h4 b{font-family:var(--serif);color:#C9A227;font-size:15pt;margin-right:6px;letter-spacing:0;}
  .pz table{width:100%;border-collapse:collapse;}
  .pz-f td{border:1px solid #bdb6a3;padding:6px 8px;vertical-align:top;font-size:10.5pt;height:28px;}
  .pz-f tr{break-inside:avoid;}
  .pz-f td.l{background:#F3EFE4;width:32%;font-weight:600;color:#3d3a30;font-size:9.5pt;}
  .pz-f .opt{white-space:nowrap;margin-right:12px;display:inline-block;}
  .pz-f .ob{font-size:9pt;color:#777;}
  .pz-day{border:1px solid #d6cfbd;border-radius:6px;padding:10px 12px;margin-bottom:10px;break-inside:avoid;}
  .pz-day .dh{font-family:var(--serif);font-size:14pt;font-weight:600;color:#152647;margin-bottom:6px;}
  .pz-ck{columns:2;column-gap:24px;font-size:10.5pt;line-height:1.9;}
  .pz-ck div{break-inside:avoid;}
  .pz-small{font-size:9.5pt;color:#444;line-height:1.5;}
  .pz-sign{display:flex;gap:30px;margin-top:18px;font-size:10.5pt;}
  .pz-sign div{flex:1;border-bottom:1px solid #555;padding-bottom:4px;min-height:34px;display:flex;align-items:flex-end;gap:6px;}
  .pz-prog .dayband{background:#1F3864;color:#fff;padding:10px 14px;border-radius:6px 6px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;}
  .pz-prog .dayband .n{font-family:var(--serif);font-size:19pt;font-weight:600;line-height:1;}
  .pz-prog .dayband .d{font-size:10pt;color:#E9DDB0;text-align:right;line-height:1.4;}
  .pz-prog .info{background:#F6F2E7;padding:8px 14px;font-size:10pt;color:#3d3a30;display:flex;flex-wrap:wrap;gap:4px 22px;border:1px solid #e3dccb;border-top:none;}
  .pz-prog .info b{color:#1F3864;}
  .pz-prog table{margin-top:0;border:1px solid #e3dccb;border-top:none;}
  .pz-prog th{background:#fff;text-align:left;font-size:8.5pt;letter-spacing:.12em;text-transform:uppercase;color:#8a7f60;padding:9px 12px;border-bottom:1.5px solid #C9A227;}
  .pz-prog td{padding:11px 12px;border-bottom:1px solid #eee7d6;font-size:11pt;vertical-align:top;}
  .pz-prog tr:nth-child(even) td{background:#FCFAF5;}
  .pz-prog td.t{font-weight:700;color:#1F3864;white-space:nowrap;width:80px;}
  .pz-prog td.s{font-weight:600;width:34%;}
  .pz-prog td.p{color:#1F3864;}
  .pz-prog td .ds{display:block;font-weight:400;color:#777;font-size:9.5pt;margin-top:2px;}
  .pz-team{margin-top:12px;border:1px solid #e3dccb;border-radius:6px;padding:10px 14px;font-size:10pt;display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;}
  .pz-team b{color:#1F3864;display:inline-block;min-width:118px;}
  .pz-obit{display:flex;justify-content:center;}
  .pz-guide{font-size:10.5pt;line-height:1.55;}
  .pz-guide ul{margin:4px 0 8px;padding-left:18px;}

  /* ============ OBITUARY TEMPLATES (540 x 764 base) ============ */
  .ob{width:540px;min-height:764px;position:relative;overflow:hidden;text-align:center;font-family:var(--serif);color:#2c2b27;}
  .ob *{box-sizing:border-box;}
  .ob .ph{background-size:cover;background-position:center;background-color:#e9e6de;display:flex;align-items:center;justify-content:center;color:#b3ab95;font-size:42px;}
  .ob .zh{font-family:"Ma Shan Zheng","Noto Serif SC",serif;}
  .ob .svc-h{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin:14px 0 5px;}
  .ob .svc{font-size:15.5px;line-height:1.4;margin-bottom:5px;}
  .ob .svc b{font-weight:700;}
  .ob .verse{font-style:italic;font-size:16px;line-height:1.45;margin:12px 34px 0;}
  .ob .vref{font-family:var(--sans);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-top:5px;}
  .ob .surv{font-size:15.5px;line-height:1.5;white-space:pre-line;}
  .ob .foot{font-family:var(--sans);font-size:10.5px;line-height:1.6;margin-top:14px;}
  .ob .church{font-family:var(--sans);font-size:10px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;margin-top:8px;}
  .ob .inner{position:relative;z-index:2;}
  .ob svg,.ob img.orn{position:absolute;pointer-events:none;height:auto;max-width:none;}

  /* 1 Grace (ink & lily) */
  .ob-grace{background-color:#fbfaf7;background-size:360px;padding:26px 44px 30px;color:#3f3d4a;}
  .ob-grace .top{position:relative;height:300px;margin:0 auto 4px;width:300px;}
  .ob-grace .ring{position:absolute;inset:0;background-size:100% 100%;}
  .ob-grace .ph{position:absolute;width:186px;height:186px;border-radius:50%;left:57px;top:57px;}
  .ob-grace .ilm{font-family:var(--sans);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:#7c7a8c;margin-top:4px;}
  .ob-grace .nm{font-size:34px;font-weight:600;color:#55507f;margin-top:6px;line-height:1.1;}
  .ob-grace .zh{font-size:34px;color:#8b86bb;margin-top:4px;letter-spacing:.12em;}
  .ob-grace .yr{font-family:var(--sans);font-size:12px;letter-spacing:.3em;color:#7c7a8c;margin-top:6px;}
  .ob-grace .rule{width:44px;height:1px;background:#a9a5c7;margin:12px auto;}
  .ob-grace .called{font-size:16.5px;line-height:1.5;}
  .ob-grace .svc-h,.ob-grace .vref{color:#6f6aa3;} .ob-grace .svc b{color:#3b3766;}
  .ob-grace .church{color:#1F3864;}
  /* 2 Classic gold */
  .ob-classic{background:#FFFDF8;padding:40px 40px 32px;border:1px solid #E6DCC0;}
  .ob-classic:before{content:"";position:absolute;inset:12px;border:1px solid #C9A227;}
  .ob-classic:after{content:"";position:absolute;inset:16px;border:.5px solid rgba(201,162,39,.45);}
  .ob-classic .cr{font-size:30px;color:#C9A227;line-height:1;}
  .ob-classic .ilm{font-style:italic;font-size:20px;color:#6b6450;margin-top:6px;}
  .ob-classic .ph{width:150px;height:184px;margin:16px auto 8px;border:4px solid #fff;box-shadow:0 0 0 1px #C9A227;}
  .ob-classic .nm{font-size:35px;font-weight:600;color:#152647;margin-top:10px;line-height:1.1;}
  .ob-classic .zh{font-family:"Noto Serif SC",serif;font-size:21px;color:#4a4636;margin-top:4px;letter-spacing:.18em;}
  .ob-classic .yr{font-size:18px;color:#6b6450;margin-top:4px;letter-spacing:.1em;}
  .ob-classic .rule{width:60px;height:1px;background:#C9A227;margin:14px auto;}
  .ob-classic .called{font-size:17px;line-height:1.5;}
  .ob-classic .svc-h{color:#1F3864;} .ob-classic .vref,.ob-classic .church{color:#a4831a;} .ob-classic .svc b{color:#152647;}
  /* 3 Evening */
  .ob-eve{background:linear-gradient(180deg,#32363c 0%,#25282d 55%,#1d1f23 100%);color:#e9e7e2;padding:40px 46px 34px;}
  .ob-eve .ilm{font-style:italic;font-size:30px;font-weight:500;color:#fff;}
  .ob-eve .ph{width:214px;height:214px;border-radius:50%;margin:18px auto 6px;border:7px solid #fff;box-shadow:0 0 0 10px rgba(255,255,255,.08);}
  .ob-eve .nm{font-family:"Great Vibes",cursive;font-size:58px;color:#fff;line-height:1.05;margin-top:10px;}
  .ob-eve .zh{font-size:28px;color:#e6dfc8;letter-spacing:.14em;}
  .ob-eve .yr{font-family:var(--sans);font-size:13px;letter-spacing:.34em;color:#cfcac0;margin-top:6px;}
  .ob-eve .rule{width:50px;height:1px;background:#9d978b;margin:13px auto;}
  .ob-eve .called{font-size:16.5px;line-height:1.5;color:#e9e7e2;}
  .ob-eve .svc-h,.ob-eve .vref{color:#d6c79a;} .ob-eve .svc b{color:#fff;} .ob-eve .foot{color:#bdb8ad;} .ob-eve .church{color:#d6c79a;}
  /* 4 Sage arch */
  .ob-sage{background:#46524b;color:#eef0ea;padding:46px 50px 38px;}
  .ob-sage:before{content:"";position:absolute;inset:16px;border:1px solid rgba(255,255,255,.55);}
  .ob-sage .ilm{font-size:24px;font-weight:500;letter-spacing:.02em;}
  .ob-sage .archw{position:relative;width:230px;margin:16px auto 6px;}
  .ob-sage .ph{width:190px;height:236px;border-radius:95px 95px 0 0;margin:0 auto;}
  .ob-sage .arch{position:absolute;left:12px;top:-8px;width:206px;height:252px;border:1.3px solid rgba(255,255,255,.85);border-radius:103px 103px 0 0;border-bottom:none;}
  .ob-sage .nm{font-size:34px;font-weight:500;letter-spacing:.04em;margin-top:12px;color:#fff;}
  .ob-sage .zh{font-size:28px;color:#e5e9de;letter-spacing:.14em;}
  .ob-sage .yr{font-family:var(--sans);font-size:12px;letter-spacing:.32em;color:#d3d9cc;margin-top:4px;}
  .ob-sage .rule{width:180px;height:0;border-top:1px dashed rgba(255,255,255,.5);margin:12px auto;}
  .ob-sage .called{font-size:16.5px;line-height:1.5;}
  .ob-sage .svc-h,.ob-sage .vref{color:#dfe7c9;} .ob-sage .svc b{color:#fff;} .ob-sage .foot{color:#d3d9cc;} .ob-sage .church{color:#fff;}
  /* 5 Sky lilies */
  .ob-sky{background:
     radial-gradient(ellipse 60% 30% at 20% 18%,rgba(255,255,255,.75),transparent 70%),
     radial-gradient(ellipse 55% 25% at 85% 55%,rgba(255,255,255,.6),transparent 70%),
     radial-gradient(ellipse 70% 30% at 40% 88%,rgba(255,255,255,.55),transparent 70%),
     linear-gradient(170deg,#a9cbe8 0%,#c6def0 45%,#b7d3ec 100%);
     color:#1f3150;padding:42px 50px 36px;}
  .ob-sky .ilm{font-family:var(--sans);font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:600;color:#25406a;}
  .ob-sky .ph{width:208px;height:208px;border-radius:50%;margin:16px auto 6px;border:7px solid #fff;box-shadow:0 6px 20px rgba(31,49,80,.18);}
  .ob-sky .nm{font-family:"Great Vibes",cursive;font-size:56px;color:#1f3150;line-height:1.05;margin-top:6px;}
  .ob-sky .zh{font-size:28px;color:#2f4c7a;letter-spacing:.14em;}
  .ob-sky .yr{font-family:var(--sans);font-size:13px;letter-spacing:.24em;font-weight:600;color:#25406a;margin-top:4px;}
  .ob-sky .rule{width:120px;height:12px;margin:10px auto;background:radial-gradient(circle,#25406a 2px,transparent 2.5px) center/12px 12px no-repeat,linear-gradient(#25406a,#25406a) center/100% 1px no-repeat;}
  .ob-sky .called{font-size:16.5px;line-height:1.5;}
  .ob-sky .svc-h,.ob-sky .vref{color:#25406a;} .ob-sky .church{color:#1f3150;}
  .ob-sky .card2{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 14px 10px;margin-top:12px;}
  /* 6 Modern split */
  .ob-modern{background:linear-gradient(135deg,#fbfbfa 0%,#f1f0ee 50%,#fafaf9 100%);display:flex;text-align:left;}
  .ob-modern .lc{width:200px;flex-shrink:0;position:relative;background:#d8d6d2;}
  .ob-modern .lc .ph{position:absolute;inset:0;font-size:60px;background-position:center 20%;}
  .ob-modern .lc .host{position:absolute;left:18px;right:18px;bottom:22px;color:#fff;font-family:var(--sans);font-size:11px;line-height:1.5;text-shadow:0 1px 3px rgba(0,0,0,.4);}
  .ob-modern .rc{flex:1;padding:44px 34px 34px 30px;}
  .ob-modern .crx{position:relative;width:64px;height:64px;margin-bottom:10px;}
  .ob-modern .ilm{font-family:var(--sans);font-size:13px;color:#555;letter-spacing:.04em;}
  .ob-modern .nm{font-size:36px;font-weight:600;text-transform:uppercase;color:#6b1f24;line-height:1.05;letter-spacing:.02em;margin-top:4px;}
  .ob-modern .zh{font-size:26px;color:#6b1f24;letter-spacing:.12em;margin-top:4px;}
  .ob-modern .yr{font-family:var(--sans);font-size:12px;letter-spacing:.24em;color:#777;margin-top:6px;}
  .ob-modern .rule{width:40px;height:2px;background:#6b1f24;margin:14px 0;}
  .ob-modern .called{font-family:var(--sans);font-size:13.5px;line-height:1.6;color:#444;}
  .ob-modern .verse{margin:12px 0 0;font-size:15.5px;color:#444;}
  .ob-modern .vref{color:#6b1f24;}
  .ob-modern .surv{font-family:var(--sans);font-size:13px;color:#444;margin-top:10px;}
  .ob-modern .big{font-size:30px;font-weight:600;color:#6b1f24;line-height:1.1;margin-top:4px;}
  .ob-modern .svc-h{color:#6b1f24;text-align:left;}
  .ob-modern .svc{font-family:var(--sans);font-size:13px;color:#333;}
  .ob-modern .foot{color:#666;text-align:left;} .ob-modern .church{color:#6b1f24;text-align:left;}
  /* 7 Celebration */
  .ob-celeb{background:
     radial-gradient(ellipse 45% 35% at 0% 0%,rgba(150,150,150,.20),transparent 70%),
     radial-gradient(ellipse 50% 40% at 100% 100%,rgba(150,150,150,.20),transparent 70%),
     radial-gradient(ellipse 30% 25% at 100% 10%,rgba(180,180,180,.14),transparent 70%),#fdfcfa;
     color:#3a3a38;padding:40px 54px 34px;}
  .ob-celeb .ilm0{font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#6d6b66;}
  .ob-celeb .ph{width:176px;height:176px;border-radius:50%;margin:16px auto 4px;border:5px solid #fff;box-shadow:0 0 0 1px #d8d5cd;}
  .ob-celeb .ilm{font-style:italic;font-size:18px;color:#5d5b55;margin-top:10px;}
  .ob-celeb .nm{font-family:"Great Vibes",cursive;font-size:56px;color:#2f2f2c;line-height:1.05;}
  .ob-celeb .zh{font-size:28px;color:#555;letter-spacing:.14em;}
  .ob-celeb .yr{font-size:17px;letter-spacing:.12em;color:#6d6b66;}
  .ob-celeb .rule{width:200px;height:1px;background:linear-gradient(90deg,transparent,#bbb,transparent);margin:12px auto;}
  .ob-celeb .called{font-style:italic;font-size:16.5px;line-height:1.5;}
  .ob-celeb .svc-h,.ob-celeb .vref{color:#7d7a72;} .ob-celeb .church{color:#555;}
</style>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MONL=['January','February','March','April','May','June','July','August','September','October','November','December'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function pd(iso){ if(!iso) return null; const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDate(iso,dow=true){ const d=pd(iso); if(!d) return '—'; return (dow?DOW[d.getDay()]+', ':'')+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
function fmtLong(iso){ const d=pd(iso); return d? d.getDate()+' '+MONL[d.getMonth()]+' '+d.getFullYear() : ''; }
function fmtFull(iso){ const d=pd(iso); return d? DOWL[d.getDay()]+', '+d.getDate()+' '+MONL[d.getMonth()]+' '+d.getFullYear() : ''; }
function fmtTime(t){ if(!t) return ''; let [h,m]=t.split(':').map(Number); const ap=h>=12?'PM':'AM'; h=h%12||12; return h+(m?':'+String(m).padStart(2,'0'):'')+' '+ap; }
function addMin(t,n){ if(!t) return ''; let [h,m]=t.split(':').map(Number); let x=((h*60+m+n)%1440+1440)%1440; return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=pd(s); if(!d) return ''; d.setDate(d.getDate()+n); return iso(d); }
const todayISO = () => iso(new Date());
function calcAge(dob,dop){ const a=pd(dob),b=pd(dop); if(!a||!b) return ''; let y=b.getFullYear()-a.getFullYear(); if(b.getMonth()<a.getMonth()||(b.getMonth()===a.getMonth()&&b.getDate()<a.getDate())) y--; return y>=0?y:''; }
function getP(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k],o); }
function setP(o,p,v){ const ks=p.split('.'); let x=o; ks.slice(0,-1).forEach(k=>{ if(x[k]==null) x[k]={}; x=x[k]; }); x[ks[ks.length-1]]=v; }
function waNum(p){ let d=String(p||'').replace(/\D/g,''); if(!d) return ''; if(d.startsWith('0')) d='6'+d; return d; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2400); }

const fun = c => c.days.find(d=>d.type==='funeral') || {};

const blankProg = type => (type==='funeral'?SEG_FUNERAL:SEG_WAKE).map(s=>({k:s.k,seg:s.seg,desc:s.desc,dur:s.dur,role:s.role,pic:'',skip:false}));
function newDay(type, from){
  const d={id:uid(), type, date:'', time:type==='funeral'?'10:00':'20:00', location:'', locOther:'', undertaker:'', venue:'', langs:['English'], langOther:'', remarks:'', same:false, roster:blankRoster(), prog:blankProg(type)};
  if(type==='funeral'){ d.serviceType=''; d.site=''; }
  if(from){ d.date=from.date?addDays(from.date,1):''; d.time=from.time; d.same=true; }
  return d;
}
function blankTasks(){ const t={}; TASKS.forEach(([k])=>t[k]={who:'',status:'To do',notes:'',by:'',at:''}); return t; }
function newCase(){
  const me=ls('tow_fn_me')||'';
  const c={ id:uid(), created:new Date().toISOString(), status:'active', rev:0,
    call:{date:todayISO(), time:'', receivedBy:me, coordinator:CONFIG.COORDINATOR, membership:'Member'},
    deceased:{name:'',zh:'',dob:'',dop:todayISO(),age:'',gender:'',marital:'',cause:''},
    kin:{name:'',relation:'',phone:'',address:''}, survivedBy:'',
    undertaker:{company:'',contact:'',phone:'',pkg:''},
    days:[], tasks:blankTasks(),
    flowers:{items:'',florist:'',deliveryDate:'',deliveryTime:'',deliverTo:'',cost:'',notes:''},
    checks:{}, files:[], texts:{obituary:'',programme:''}, ack:{name:'',date:'',agreed:false,sig:''},
    obit:{tpl:'grace', verse:'john11', called:'Called home to be with the Lord', photo:'', showZh:true, extra:''} };
  c.tasks.undertaker.who=me;
  const w=newDay('wake'); w.date=todayISO(); c.days.push(w);
  const f=newDay('funeral'); f.date=addDays(todayISO(),1); c.days.push(f);
  return c;
}
function normalize(c){
  const b=newCase();
  ['call','deceased','kin','undertaker','flowers','ack','obit'].forEach(k=>{ c[k]=Object.assign({}, b[k], c[k]||{}); });
  c.checks=c.checks||{}; c.files=c.files||[]; c.texts=Object.assign({obituary:'',programme:''},c.texts||{}); c.tasks=Object.assign(blankTasks(), c.tasks||{});
  TASKS.forEach(([k])=>{ c.tasks[k]=Object.assign({who:'',status:'To do',notes:''}, c.tasks[k]); });
  c.days=c.days&&c.days.length?c.days:b.days;
  c.days.forEach(d=>{ d.roster=Object.assign(blankRoster(), d.roster||{}); if(!d.prog) d.prog=blankProg(d.type);
    if(!Array.isArray(d.langs)){ d.langs = d.language ? [d.language] : []; delete d.language; } if(d.langOther==null) d.langOther=''; });
  return c;
}
function eff(c,d){ if(d.type==='wake' && d.same){ const w=wakes(c)[0]; if(w && w!==d) return Object.assign({}, w, {id:d.id,date:d.date,time:d.time,same:true,roster:d.roster,prog:d.prog}); } return d; }
function dayLabel(c,d){ return d.type==='funeral' ? 'Funeral Service' : 'Wake Service · Night '+(wakes(c).indexOf(d)+1); }
function dayShort(c,d){ return d.type==='funeral' ? 'Funeral' : 'Night '+(wakes(c).indexOf(d)+1); }
function locText(d){ const l=d.location==='Other'?(d.locOther||''):d.location; return [l,d.venue].filter(Boolean).join(' — '); }
function venueText(d){ return d.venue || (d.location==='Other'?d.locOther:d.location) || ''; }
function langText(d){ return (d.langs||[]).concat(d.langOther?[d.langOther]:[]).join(', '); }
function whoName(c,who){ return who==='p1' ? (c.call.receivedBy||'Pastor who received the call') : (c.call.coordinator||CONFIG.COORDINATOR); }
function allItems(st){ const a=st.items.slice(); if(st.undertaker) UNDERTAKER.forEach(g=>g.items.forEach(i=>a.push({k:i[0],t:i[1]}))); return a; }
function isDone(c,it){
  if(it.task) return c.tasks[it.task].status==='Done';
  const ck=c.checks[it.k];
  return !!(ck && ck.done) || !!(it.auto && it.auto(c) && !(ck && ck.off));
}
function stageInfo(c){
  let total=0,done=0,cur=null;
  const per=STAGES.map(st=>{ const its=allItems(st), dn=its.filter(i=>isDone(c,i)).length; total+=its.length; done+=dn; const complete=dn===its.length; if(!complete&&cur==null) cur=st.k; return {k:st.k,dn,n:its.length,complete}; });
  return {per,total,done,pct:total?Math.round(done/total*100):0,cur,curStage:STAGES.find(s=>s.k===cur)};
}
function summary(c){ const si=stageInfo(c), f=fun(c), w=wakes(c); return {id:c.id, name:c.deceased.name, zh:c.deceased.zh, kin:c.kin.name, dop:c.deceased.dop, fdate:f.date||'', ftime:f.time||'', wakes:w.length, w1:w[0]?w[0].date:'', receivedBy:c.call.receivedBy, coordinator:c.call.coordinator, stage:si.curStage?si.curStage.t:'All done', pct:si.pct, done:si.done, total:si.total, status:c.status, manual:!!c.manual, files:(c.files||[]).length+['obituary','programme'].filter(k=>c.texts&&c.texts[k]&&c.texts[k].trim()).length, updated:c.updated||c.created}; }
const people = c => [...new Set(CONFIG.PASTORS.concat(CONFIG.TEAM, c?[c.call.receivedBy,c.call.coordinator]:[]).filter(Boolean))];

/* ---------------- Storage / sync ---------------- */
const S = { index:[], full:{}, view:'home', cur:null, tab:'details', filter:'active', year:'all', q:'', pin:ls('tow_fn_pin')||'', dirty:new Set(), saving:false, tg:false };
const LOCAL = !CONFIG.API_URL;
let COL = {}; try{ COL = JSON.parse(ls('tow_fn_col')||'{}'); }catch(e){}
function setSync(cls,txt){ const s=$('#sync'); s.className='sync '+cls; s.textContent=txt; const st=$('#saveTxt'); if(st) st.textContent=txt; }
async function api(body){
  const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({pin:S.pin,adminPin:ls('tow_fn_admin')||'',by:ls('tow_fn_me')||''},body))});
  const j=await r.json();
  if(!j.ok && j.error==='PIN'){ S.pin=''; ls('tow_fn_pin',null); showLock('Incorrect PIN — please try again.'); throw new Error('PIN'); }
  return j;
}
function localAll(){ try{ return JSON.parse(ls('tow_fn_cases')||'[]').map(normalize); }catch(e){ return []; } }
async function loadIndex(){
  if(LOCAL){ const all=localAll(); all.forEach(c=>S.full[c.id]=c); S.index=all.map(summary); setSync('local','Test mode · saved on this device'); return; }
  setSync('saving','Loading…');
  try{ const j=await api({action:'list'}); if(j.ok){ S.index=j.cases||[]; S.tg=!!j.telegram; S.sheetUrl=j.sheetUrl||''; showSheetBtn(true); setSync('','Synced'); } else setSync('err',j.error||'Error'); }
  catch(e){ if(e.message!=='PIN') setSync('err','Offline — cannot reach server'); throw e; }
}
async function openCase(id, tab){
  if(!S.full[id] && !LOCAL){ setSync('saving','Opening…'); try{ const j=await api({action:'get',id}); if(!j.ok||!j.case){ toast('Could not open this case'); setSync('err','Error'); return; } S.full[id]=normalize(j.case); setSync('','Synced'); }catch(e){ return; } }
  S.cur=id; S.view='case'; S.tab=tab||'workflow'; render(); window.scrollTo(0,0);
}
const cur = () => S.full[S.cur];
let saveT=null;
function touch(c){ c=c||cur(); if(!c) return; c.updated=new Date().toISOString(); c.summary=summary(c); const i=S.index.findIndex(x=>x.id===c.id); if(i>=0) S.index[i]=c.summary; else S.index.push(c.summary); S.dirty.add(c.id); clearTimeout(saveT); setSync('saving','Saving…'); saveT=setTimeout(flush,1000); }
async function flush(){
  clearTimeout(saveT);
  if(LOCAL){ const all=Object.values(S.full); ls('tow_fn_cases',JSON.stringify(all)); S.dirty.clear(); setSync('local','Test mode · saved on this device'); return true; }
  if(S.saving){ return new Promise(r=>setTimeout(()=>r(flush()),500)); }
  if(!S.dirty.size){ return true; }
  S.saving=true; const ids=[...S.dirty]; S.dirty.clear(); let ok=true;
  try{
    for(const id of ids){
      const c=S.full[id]; if(!c) continue;
      const j=await api({action:'save',case:c});
      if(j.ok){ c.rev=j.rev; }
      else if(j.conflict && j.current){ S.full[id]=normalize(j.current); toast('Someone else updated this case — showing the latest version.'); if(S.cur===id) render(); }
      else throw new Error(j.error||'Save failed');
    }
    setSync('','Saved · '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
  }catch(e){ ok=false; ids.forEach(i=>S.dirty.add(i)); if(e.message!=='PIN'){ setSync('err','Not saved — retrying'); saveT=setTimeout(flush,5000); } }
  S.saving=false; return ok;
}
window.addEventListener('beforeunload',e=>{ if(S.dirty.size&&!LOCAL){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden' && S.dirty.size) flush(); });

function toggleBox(el, force){ const id=el.dataset.box; const open = force!==undefined ? force : el.classList.contains('shut'); el.classList.toggle('shut',!open); COL[colKey(id)]=open; ls('tow_fn_col',JSON.stringify(COL)); if(open && S.tab==='obituary') fitObit(); }
const toolsBar = () => '<div class="tools"><button data-all="1">Expand all</button><button data-all="0">Collapse all</button></div>';
function sec(letter,title,hint){ return '<div class="sec-title">'+(letter?'<span class="letter">'+letter+'</span>':'')+'<h2>'+title+(hint?' <span class="hint">· '+hint+'</span>':'')+'</h2></div>'; }

/* ---------------- Render: home ---------------- */
function render(){ showSheetBtn(true); if(S.view==='home') return renderHome(); renderCase(); }
function renderHome(){
  $('#tabs').style.display='none'; $('#savebar').style.display='none'; $('#crumb').textContent='All funeral requests';
  const q=S.q.toLowerCase();
  const yearOf = s => (s.fdate||s.dop||s.updated||'').slice(0,4);
  const years=[...new Set(S.index.map(yearOf).filter(Boolean))].sort().reverse();
  let list=S.index.filter(s=>S.filter==='all'||(S.filter==='active'?s.status!=='closed':s.status==='closed'))
    .filter(s=>S.year==='all'||yearOf(s)===S.year)
    .filter(s=>!q||[s.name,s.zh,s.kin].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=> S.filter==='active' ? (a.fdate||'9').localeCompare(b.fdate||'9') : (b.fdate||'').localeCompare(a.fdate||''));
  const cnt={active:S.index.filter(s=>s.status!=='closed').length, closed:S.index.filter(s=>s.status==='closed').length};
  let h='<div class="toolbar"><input type="search" id="q" placeholder="Search name or family contact" value="'+esc(S.q)+'"><button class="btn primary" id="newBtn">＋ New request</button></div>';
  h+='<div class="toolbar"><div class="pills">'+[['active','Active ('+cnt.active+')'],['closed','Past records ('+cnt.closed+')'],['all','All']].map(([k,l])=>'<label class="pill"><input type="radio" name="flt" value="'+k+'"'+(S.filter===k?' checked':'')+'><span>'+l+'</span></label>').join('')+'</div>'+
    '<select id="yearSel" style="width:auto;min-height:36px;padding:6px 10px;font-size:13px"><option value="all">All years</option>'+years.map(y=>'<option'+(S.year===y?' selected':'')+'>'+y+'</option>').join('')+'</select>'+
    '<div class="btnrow" style="margin-left:auto"><button class="btn sm" id="pastBtn">＋ Past record</button><button class="btn sm" id="blankBtn">⎙ Blank form</button><button class="btn sm" id="expBtn">⤓ Backup</button>'+(LOCAL?'':'<button class="btn sm" id="refBtn">↻</button>')+'</div></div>';
  if(LOCAL) h+='<div class="note" style="margin:0 0 12px">Test mode — requests are saved in this browser only. Paste the Apps Script link into <b>CONFIG.API_URL</b> so the whole team shares one list.</div>';
  if(!list.length) h+='<div class="empty"><div style="font-family:var(--serif);font-size:40px;color:var(--gold)">✝</div><div style="font-family:var(--serif);font-size:22px;color:var(--navy-dark);margin:6px 0">No requests here</div><div class="small">When a family calls, tap “New request”.</div></div>';
  let lastY=null;
  list.forEach(s=>{
    const y=yearOf(s); if(S.filter!=='active' && y!==lastY){ h+='<div class="yearhd">'+(y||'Undated')+'</div>'; lastY=y; }
    const chip=s.manual?'<span class="chip navy">Past record'+(s.files?' · '+s.files+' file'+(s.files>1?'s':''):'')+'</span>':s.status==='closed'?'<span class="chip grey">Closed</span>':s.stage==='All done'?'<span class="chip green">All done</span>':'<span class="chip gold">'+esc(s.stage)+'</span>';
    if(s.manual){ h+='<div class="card case-card" data-open="'+s.id+'"><div class="crow"><div style="min-width:0"><div class="cname">'+esc(s.name||'Unnamed')+(s.zh?'<span class="zh">'+esc(s.zh)+'</span>':'')+'</div><div class="cmeta">'+(s.dop?'Passed '+fmtDate(s.dop,false):'')+(s.fdate?(s.dop?' · ':'')+'Funeral '+fmtDate(s.fdate):'')+'</div></div>'+chip+'</div></div>'; return; }
    h+='<div class="card case-card" data-open="'+s.id+'"><div class="crow"><div style="min-width:0"><div class="cname">'+esc(s.name||'Unnamed')+(s.zh?'<span class="zh">'+esc(s.zh)+'</span>':'')+'</div><div class="cmeta">'+(s.wakes?s.wakes+' wake night'+(s.wakes>1?'s':'')+(s.w1?' from '+fmtDate(s.w1,false):'')+' · ':'')+'Funeral '+fmtDate(s.fdate)+(s.ftime?', '+fmtTime(s.ftime):'')+'<br>Received by '+esc(s.receivedBy||'—')+' · Coordinator '+esc(s.coordinator||'—')+'</div></div>'+chip+'</div><div style="display:flex;align-items:center;gap:10px;margin-top:12px"><div class="bar" style="flex:1"><i style="width:'+(s.pct||0)+'%"></i></div><span class="small muted">'+(s.pct||0)+'%</span></div></div>';
  });
  if(!LOCAL) h+='<div style="text-align:center;margin:28px 0 6px"><button id="adminBtn" style="background:none;border:none;color:#b3ab95;font-size:11.5px;cursor:pointer;letter-spacing:.04em">'+(ls('tow_fn_admin')?'Admin ✓':'Admin')+'</button></div>';
  $('#app').innerHTML=h;
  const ab=$('#adminBtn'); if(ab) ab.onclick=adminBox;
  $('#q').oninput=e=>{ S.q=e.target.value; const p=e.target.selectionStart; renderHome(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p); };
  $('#newBtn').onclick=()=>{ const c=newCase(); S.full[c.id]=c; S.cur=c.id; S.view='case'; S.tab='details'; touch(c); render(); window.scrollTo(0,0); };
  $('#pastBtn').onclick=()=>{ const c=newCase(); c.manual=true; c.status='closed'; c.call.receivedBy=''; c.call.date=''; c.tasks.undertaker.who=''; c.deceased.dop=''; c.days.forEach(d=>d.date=''); S.full[c.id]=c; S.cur=c.id; S.view='case'; S.tab='details'; touch(c); render(); window.scrollTo(0,0); toast('Past record — fill in the name & dates, then upload the files'); };
  $$('input[name=flt]').forEach(r=>r.onchange=()=>{ S.filter=r.value; renderHome(); });
  $('#yearSel').onchange=e=>{ S.year=e.target.value; renderHome(); };
  $$('[data-open]').forEach(el=>el.onclick=()=>openCase(el.dataset.open));
  $('#blankBtn').onclick=()=>doPrint(formHTML(null));
  $('#expBtn').onclick=exportAll;
  const rb=$('#refBtn'); if(rb) rb.onclick=async()=>{ await flush(); S.full={}; await loadIndex(); renderHome(); toast('Updated'); };
}
async function exportAll(){
  let data;
  if(LOCAL) data=Object.values(S.full);
  else { toast('Preparing backup…'); try{ const j=await api({action:'export'}); data=j.cases||[]; }catch(e){ return; } }
  const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),cases:data},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='TOW-funeral-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------------- Render: case ---------------- */
const TABS=[['details','Details'],['workflow','Workflow'],['team','Serving Team'],['programme','Programme'],['obituary','Obituary'],['notices','Notices']];
function renderCase(){
  const c=cur(); if(!c){ S.view='home'; return renderHome(); }
  const t=$('#tabs'); t.style.display='flex'; $('#savebar').style.display='block';
  t.innerHTML=TABS.map(([k,l])=>'<div class="tab'+(S.tab===k?' active':'')+'" data-tab="'+k+'">'+l+'</div>').join('');
  t.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{ S.tab=el.dataset.tab; renderCase(); window.scrollTo(0,0); });
  const at=t.querySelector('.active'); if(at) at.scrollIntoView({inline:'nearest',block:'nearest'});
  $('#crumb').textContent=c.deceased.name||'New funeral request';
  let h='<div class="case-head" id="caseHead"></div>'+toolsBar();
  h+=({details:vDetails,workflow:vWorkflow,team:vTeam,programme:vProgramme,obituary:vObituary,notices:vNotices}[S.tab])(c);
  $('#app').innerHTML=h;
  renderHead(c); bind(c);
  if(S.tab==='obituary') renderObit(c);
  if(S.tab==='notices') initSig(c);
}
function renderHead(c){
  const si=stageInfo(c), f=fun(c);
  const st=c.status==='closed'?'<span class="chip grey">Closed</span>':si.curStage?'<span class="chip gold">Now: '+esc(si.curStage.t)+'</span>':'<span class="chip green">All done</span>';
  $('#caseHead').innerHTML='<button class="back" id="backBtn">← All requests</button><div class="crow"><div style="min-width:0"><div class="cname">'+esc(c.deceased.name||'New funeral request')+(c.deceased.zh?'<span class="zh">'+esc(c.deceased.zh)+'</span>':'')+'</div><div class="cmeta">'+(c.deceased.dop?'Passed '+fmtDate(c.deceased.dop,false):'')+(hasAge(c.deceased)?' · Aged '+esc(c.deceased.age):'')+' · Funeral '+fmtDate(f.date)+'</div></div>'+(c.manual?'<span class="chip navy">Past record</span>':st)+'</div>'+(c.manual?'':'<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><div class="bar" style="flex:1"><i style="width:'+si.pct+'%"></i></div><span class="small muted">'+si.pct+'%</span></div>');
  $('#backBtn').onclick=async()=>{ await flush(); S.view='home'; render(); window.scrollTo(0,0); };
}

/* ---- field helpers ---- */
function fText(label,path,c,o={}){ return '<div class="'+(o.full?'full':'')+'"><label class="f">'+label+(o.hint?' <small>'+o.hint+'</small>':'')+'</label><input type="'+(o.type||'text')+'" data-b="'+path+'" value="'+esc(getP(c,path))+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.list?' list="'+o.list+'"':'')+(o.rr?' data-rr="1"':'')+(o.type==='tel'?' inputmode="tel"':'')+'></div>'; }
function fArea(label,path,c,o={}){ return '<div class="full"><label class="f">'+label+(o.hint?' <small>'+o.hint+'</small>':'')+'</label><textarea data-b="'+path+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+'>'+esc(getP(c,path))+'</textarea></div>'; }
function fPills(label,path,c,opts,o={}){ const v=getP(c,path)||''; const nm='p_'+path.replace(/\./g,'_'); return '<div class="'+(o.half?'':'full')+'"><label class="f">'+label+'</label><div class="pills">'+opts.map(x=>'<label class="pill"><input type="radio" name="'+nm+'" data-b="'+path+'" value="'+esc(x)+'"'+(x===v?' checked':'')+(o.rr?' data-rr="1"':'')+'><span>'+esc(x)+'</span></label>').join('')+'</div></div>'; }
function fMulti(label,path,c,opts){ const v=getP(c,path)||[]; return '<div class="full"><label class="f">'+label+' <small>(select all that apply)</small></label><div class="pills">'+opts.map(x=>'<label class="pill multi"><input type="checkbox" data-arr="'+path+'" value="'+esc(x)+'"'+(v.includes(x)?' checked':'')+'><span>'+esc(x)+'</span></label>').join('')+'</div></div>'; }
const peopleList = c => '<datalist id="ppl">'+people(c).map(p=>'<option>'+esc(p)).join('')+'</datalist>';

/* ---- Details ---- */

  let h=c.manual?'<div class="note" style="margin:0 0 12px">Past record — entered after the service. Fill in the name and dates below, then upload or paste the obituary and programme.</div>'+filesBox(c,null,true):'';
  h+=box('handling', sec('','Request handling'), '<div class="grid">'+
    fText('Call received on','call.date',c,{type:'date'})+fText('Time','call.time',c,{type:'time'})+
    fText('Received by <small>(Pastor 1)</small>','call.receivedBy',c,{list:'ppl'})+fText('Coordinator <small>(Pastor 2)</small>','call.coordinator',c,{list:'ppl'})+
    fPills('Membership','call.membership',c,['Member','Non-member'],{rr:true})+'</div>'+
    (c.call.membership==='Non-member'?'<div class="note">Non-member request — to be prayerfully reviewed by the pastoral team before confirming.</div>':'')+peopleList(c));
  h+=box('A', sec('A','Deceased & family details'), '<div class="grid">'+
    fText('Dearly departed’s full name','deceased.name',c,{full:true})+
    fText('Chinese name','deceased.zh',c,{hint:'(optional)'})+fPills('Gender','deceased.gender',c,['Male','Female'],{half:true})+
    fText('Date of birth','deceased.dob',c,{type:'date',rr:true})+fText('Date of passing','deceased.dop',c,{type:'date',rr:true})+
    fText('Age','deceased.age',c,{type:'number',hint:'(auto from dates)'})+'<div></div>'+
    fPills('Marital status','deceased.marital',c,['Single','Married','Widowed','Divorced'])+
    fText('Cause of death','deceased.cause',c,{full:true,hint:'(optional · never shown on obituary or messages)'})+
    '</div><div class="grid" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)">'+
    fText('Next of kin / contact person','kin.name',c)+fText('Relationship to deceased','kin.relation',c,{list:'rels'})+
    fText('Contact number','kin.phone',c,{type:'tel',ph:'012-345 6789'})+'<div></div>'+
    fArea('Residential address','kin.address',c)+
    fArea('Survived by <small>(for the obituary)</small>','survivedBy',c,{ph:'e.g. Beloved husband of Mary Lim\nLoving father of David & Grace\nCherished grandfather of 4'})+
    '</div><datalist id="rels">'+['Son','Daughter','Spouse','Husband','Wife','Father','Mother','Brother','Sister','Grandson','Granddaughter','Nephew','Niece','Friend'].map(r=>'<option>'+r).join('')+'</datalist>');
  h+=box('und', sec('','Funeral home / undertaker'), '<div class="grid">'+
    fText('Funeral home / undertaker','undertaker.company',c,{ph:'e.g. Nirvana'})+fText('Package','undertaker.pkg',c,{ph:'e.g. NV Gracious'})+
    fText('Contact person','undertaker.contact',c)+fText('Contact number','undertaker.phone',c,{type:'tel'})+'</div>');
  let b='<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="small" style="font-weight:600;color:#5b5748">Wake nights</span><div class="stepper"><button data-act="wakeMinus">−</button><b>'+wakes(c).length+'</b><button data-act="wakePlus">＋</button></div><span class="small muted">followed by the funeral service</span></div>';
  c.days.forEach((d,i)=>{ b+=dayBox(c,d,i); });
  h+=box('B', sec('B','Service details'), b, {open:!c.manual});
  if(!c.manual) h+=filesBox(c,null,false);
  h+='<div class="card"><div class="btnrow" style="justify-content:space-between"><div class="btnrow">'+(c.status==='closed'?'<button class="btn" data-act="reopen">Reopen case</button>':'<button class="btn" data-act="close">Mark case closed</button>')+'<button class="btn" data-act="printForm">⎙ Print request form</button></div><button class="btn danger" data-act="delete">Delete</button></div></div>';
  return h;
}
function dayBox(c,d,i){
  const p='days.'+i+'.', w=wakes(c), first=d.type==='wake'&&w[0]===d;
  const title='<div class="h3">'+(d.type==='funeral'?'Funeral Service':'Wake · Night '+(w.indexOf(d)+1))+'<small>'+fmtDate(d.date)+(d.time?' · '+fmtTime(d.time):'')+'</small></div>';
  let h='<div class="grid">';
  if(d.type==='wake' && !first) h+='<div class="full"><label class="switch"><input type="checkbox" data-b="'+p+'same" data-rr="1"'+(d.same?' checked':'')+'><i></i>Same venue & details as Night 1</label></div>';
  h+=fText('Date',p+'date',c,{type:'date',rr:true})+fText('Time',p+'time',c,{type:'time'});
  if(d.type==='wake' && d.same && !first){ const f=w[0]; h+='<div class="full small muted">'+esc(locText(f)||'—')+(langText(f)?' · '+esc(langText(f)):'')+'</div></div>'; return box('day-'+d.id,title,h,{open:false}); }
  if(d.type==='funeral') h+=fPills('Type of service',p+'serviceType',c,['Burial','Cremation'],{rr:true});
  h+=fPills('Location',p+'location',c,['Church','Funeral Home','Residence','Other'],{rr:true});
  if(d.location==='Other') h+=fText('Other location',p+'locOther',c,{full:true});
  h+=fText('Funeral home / undertaker',p+'undertaker',c,{ph:c.undertaker.company})+fText('Address / venue',p+'venue',c);
  if(d.type==='funeral') h+=fText(d.serviceType==='Cremation'?'Crematorium':'Burial site / cemetery',p+'site',c,{full:true,hint:'(for the obituary)'});
  h+=fMulti('Language preference',p+'langs',c,CONFIG.LANGUAGES)+fText('Other language',p+'langOther',c,{hint:'(optional)'})+'<div></div>'+fArea('Remarks',p+'remarks',c)+'</div>';
  return box('day-'+d.id,title,h,{open:i===0||d.type==='funeral'});
}

/* ---- Workflow ---- */
function vWorkflow(c){
  const si=stageInfo(c); let h=c.manual?'<div class="note" style="margin:0 0 12px">Past record — the checklist wasn’t used for this funeral. You can still tick items if helpful.</div>':'';
  STAGES.forEach((st,n)=>{
    const p=si.per[n], cls=p.complete?'done':(si.cur===st.k?'current':'');
    const head='<div class="h3" style="font-family:var(--sans);font-size:15px;font-weight:700">'+st.t+'</div><div class="owner">Led by <b>'+esc(whoName(c,st.who))+'</b></div>';
    let b='<div class="small muted" style="margin-bottom:4px">'+st.d+'</div>';
    st.items.forEach(it=>b+=itemRow(c,it));
    if(st.undertaker){ if(c.undertaker.company||c.undertaker.pkg) b+='<div class="note" style="margin-top:6px">'+esc([c.undertaker.company,c.undertaker.pkg].filter(Boolean).join(' · '))+(c.undertaker.contact||c.undertaker.phone?' — '+esc(c.undertaker.contact)+' '+esc(c.undertaker.phone):'')+'</div>'; UNDERTAKER.forEach(g=>{ b+='<div class="grp">'+g.g+'</div><div class="ckgrid">'; g.items.forEach(i=>b+=itemRow(c,{k:i[0],t:i[1]})); b+='</div>'; }); }
    h+='<div class="stage '+cls+'"><div class="num">'+(p.complete?'✓':n+1)+'</div>'+box('st-'+st.k, head, b, {open:si.cur===st.k, right:'<span class="chip '+(p.complete?'green':cls?'gold':'grey')+'">'+p.dn+'/'+p.n+'</span>'})+'</div>';
  });
  return h;
}
function itemRow(c,it){
  const ck=c.checks[it.k]; const done=isDone(c,it); const autoOn=!it.task && it.auto && it.auto(c) && !(ck&&ck.done) && !(ck&&ck.off);
  const sub=[];
  if(it.task){ const t=c.tasks[it.task]; sub.push(t.who?'Assigned to '+esc(t.who):'<span class="warn">Not assigned yet</span>'); if(t.status==='Done'&&t.by) sub.push('✓ '+esc(t.by)); else if(t.status==='In progress') sub.push('In progress'); }
  else if(ck&&ck.done&&ck.by) sub.push('✓ '+esc(ck.by)+' · '+new Date(ck.at).toLocaleString([],{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}));
  if(autoOn) sub.push('Ticked automatically from the details');
  const msg=it.msg?' <a href="#" data-goshare="'+it.msg+'" style="font-size:11px;color:var(--navy);font-weight:600;white-space:nowrap">message ›</a>':'';
  return '<label class="item"><input type="checkbox" data-check="'+it.k+'"'+(it.task?' data-task="'+it.task+'"':'')+(done?' checked':'')+(autoOn?' data-auto="1"':'')+'><span class="box-ck"></span><span class="txt"><span class="t">'+esc(it.t)+'</span>'+(it.form?'<span class="tag">FORM</span>':'')+(autoOn?'<span class="tag auto">AUTO</span>':'')+msg+(sub.length?'<div class="sub">'+sub.join(' · ')+'</div>':'')+'</span></label>';
}

/* ---- Serving team ---- */
function vTeam(c){
  let a='<div class="small muted" style="margin-bottom:6px">The coordinator assigns each duty — choose from the list or type any name.</div>';
  TASKS.forEach(([k,t])=>{ const T=c.tasks[k]; a+='<div class="asg"><div class="tn">'+esc(t)+'</div><input type="text" list="ppl" data-b="tasks.'+k+'.who" value="'+esc(T.who)+'" placeholder="Assign to…"><select data-b="tasks.'+k+'.status" data-rr="1">'+TASK_STATUS.map(s=>'<option'+(s===T.status?' selected':'')+'>'+s+'</option>').join('')+'</select>'+
    (T.notes?'':'<button class="btn sm addn" data-addnote="1" style="grid-column:1/-1;justify-self:start;min-height:28px;padding:3px 9px;font-weight:500">＋ Note</button>')+'<input type="text" class="notes" data-b="tasks.'+k+'.notes" value="'+esc(T.notes)+'" placeholder="Notes (optional)"'+(T.notes?'':' style="display:none"')+'></div>'; });
  a+=peopleList(c);
  let h=box('asg', sec('','Duties & assignments'), a, {right:'<span class="chip '+(TASKS.every(([k])=>c.tasks[k].who)?'green':'amber')+'">'+TASKS.filter(([k])=>c.tasks[k].who).length+'/'+TASKS.length+'</span>'});
  h+=box('flowers', sec('','Flower order', c.tasks.flowers.who?'by '+esc(c.tasks.flowers.who):'not assigned'), '<div class="grid">'+
    fArea('Arrangements','flowers.items',c,{ph:'e.g. Casket spray (white lilies), 2 standing wreaths, altar arrangement'})+
    fText('Florist','flowers.florist',c)+fText('Cost (RM)','flowers.cost',c,{type:'number'})+
    fText('Delivery date','flowers.deliveryDate',c,{type:'date'})+fText('Delivery time','flowers.deliveryTime',c,{type:'time'})+
    fText('Deliver to','flowers.deliverTo',c,{full:true,ph:venueText(eff(c,c.days[0]))})+fArea('Notes','flowers.notes',c)+'</div>', {open:false});
  c.days.forEach((d,i)=>{
    const p='days.'+i+'.roster.', r=d.roster, filled=ROLES.slice(0,5).filter(([k])=>r[k]).length;
    let b='<div class="grid">'+ROLES.map(([k,l])=>fText(l,p+k,c,{list:'ppl',full:k==='helpers',ph:k==='helpers'?'Names, separated by commas':''})).join('')+'</div>';
    if(i>0) b+='<div style="margin-top:10px"><button class="btn sm" data-copyroster="'+i+'">Copy team from '+dayShort(c,c.days[i-1])+'</button></div>';
    h+=box('ros-'+d.id, '<div class="h3">'+dayLabel(c,d)+'<small>'+fmtDate(d.date)+(eff(c,d).time?' · '+fmtTime(eff(c,d).time):'')+'</small></div>', b, {open:i===0, right:'<span class="chip '+(filled===5?'green':'grey')+'">'+filled+'/5</span>'});
  });
  h+=msgBox(c,'tasks',true)+msgBox(c,'roster');
  return h;
}

  '<g stroke="#a7b48a" stroke-width="1" fill="none"><path d="M0 0 C 4 -20 6 -34 2 -46"/><path d="M0 0 C -6 -18 -12 -30 -16 -40"/><path d="M0 0 C 8 -16 16 -26 22 -34"/><path d="M0 0 C -2 -22 -2 -36 -6 -50"/><path d="M0 0 C 12 -12 22 -18 30 -22"/><path d="M0 0 C -2 -26 4 -40 10 -52"/></g>'+
  '<g fill="#8a5a3c"><ellipse cx="2" cy="-47" rx="2" ry="4.5" transform="rotate(10 2 -47)"/><ellipse cx="-16" cy="-41" rx="2" ry="4.5" transform="rotate(-30 -16 -41)"/><ellipse cx="22" cy="-35" rx="2" ry="4.5" transform="rotate(40 22 -35)"/><ellipse cx="-6" cy="-51" rx="2" ry="4.5"/><ellipse cx="30" cy="-23" rx="2" ry="4.5" transform="rotate(60 30 -23)"/></g><circle cx="10" cy="-53" r="2.6" fill="#b9c79a"/></g>'+

  '<g id="'+p+'lf"><path d="M0 0 C 11 -20 15 -62 4 -102 C -9 -62 -9 -20 0 0 Z" fill="url(#'+p+'l)"/><path d="M0 0 C 3 -30 4 -60 4 -98" stroke="#a6b892" stroke-width=".8" fill="none"/></g></defs>'; }
const U=(p,id,tf)=>'<use xlink:href="#'+p+id+'" transform="'+tf+'"/>';
function sprigBody(p){ return lilyDefs(p)+'<path d="M30 330 C 60 260 90 200 150 150 M95 230 C 140 210 170 170 210 120 M75 270 C 60 220 40 190 20 170" stroke="#5c7a4d" stroke-width="3" fill="none" stroke-linecap="round"/>'+
  U(p,'lf','translate(70 270) rotate(-40) scale(.9)')+U(p,'lf','translate(110 220) rotate(55) scale(.8)')+U(p,'lf','translate(50 300) rotate(20) scale(.7)')+U(p,'lf','translate(150 175) rotate(-70) scale(.6)')+

function clusterBody(p){ return lilyDefs(p)+U(p,'lf','translate(60 230) rotate(-60) scale(.9)')+U(p,'lf','translate(150 220) rotate(40) scale(.8)')+U(p,'lf','translate(220 200) rotate(80) scale(.7)')+
  U(p,'bd','translate(250 150) rotate(70) scale(.8)')+U(p,'bd','translate(30 120) rotate(-40) scale(.7)')+U(p,'ly','translate(100 150) rotate(-15) scale(1.05)')+U(p,'ly','translate(190 130) rotate(25) scale(.85)')+U(p,'ly','translate(150 215) rotate(5) scale(.75)'); }
function branchBody(col,n){ let s='<g fill="none" stroke="'+col+'" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 212 C 40 170 80 120 170 40"/>';
  for(let i=1;i<=n;i++){ const t=i/(n+1); const x=8+(170-8)*t+Math.sin(t*3)*6, y=212-(212-40)*t-Math.sin(t*3)*4; const side=i%2?1:-1; const a=(-48+side*55)*Math.PI/180; const L=26-t*10; const ex=x+Math.cos(a)*L, ey=y+Math.sin(a)*L; const nx=-Math.sin(a)*L*.32, ny=Math.cos(a)*L*.32;

function initSig(c){
  const cv=$('#sigPad'); if(!cv) return;
  const fit=()=>{ const r=cv.getBoundingClientRect(), k=window.devicePixelRatio||1; cv.width=r.width*k; cv.height=r.height*k; const x=cv.getContext('2d'); x.scale(k,k); x.lineWidth=2.2; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#1d2433'; };
  fit(); let down=false, last=null, drawn=false; const x=()=>cv.getContext('2d');
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.onpointerdown=e=>{ down=true; last=pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); };
  cv.onpointermove=e=>{ if(!down) return; const p=pos(e), g=x(); g.beginPath(); g.moveTo(last.x,last.y); g.lineTo(p.x,p.y); g.stroke(); last=p; drawn=true; };
  cv.onpointerup=cv.onpointercancel=()=>{ down=false; };
  cv._drawn=()=>drawn;
}
function saveSig(c){
  const cv=$('#sigPad'); if(!cv) return; if(!cv._drawn()){ toast('Please sign first'); return; }
  const out=document.createElement('canvas'); out.width=cv.width; out.height=cv.height; const g=out.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,out.width,out.height); g.drawImage(cv,0,0);
  c.ack.sig=out.toDataURL('image/jpeg',.7); if(!c.ack.date) c.ack.date=todayISO(); if(!c.ack.name) c.ack.name=c.kin.name; touch(c); keep(renderCase); toast('Signature saved');
}
